<!DOCTYPE html>
<html>
<head>
    <title>Create x-g Icon</title>
    <style>
        body {
            font-family: monospace;
            background: #1a1a1a;
            color: white;
            padding: 20px;
        }
        canvas {
            border: 1px solid #333;
            margin: 10px;
        }
        button {
            background: #00ff88;
            color: #1a1a1a;
            border: none;
            padding: 10px 20px;
            margin: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-family: monospace;
        }
        .preview {
            display: inline-block;
            margin: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>x-g Icon Generator</h1>
    <p>Click "Generate Icons" to create the new x-g logo icons for your PWA.</p>
    
    <button onclick="generateIcons()">Generate Icons</button>
    <button onclick="downloadAll()">Download All Icons</button>
    
    <div id="icons-container"></div>

    <script>
        const sizes = [16, 32, 72, 96, 128, 144, 152, 192, 384, 512];
        
        function generateIcons() {
            const container = document.getElementById('icons-container');
            container.innerHTML = '';
            
            sizes.forEach(size => {
                const preview = document.createElement('div');
                preview.className = 'preview';
                
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                canvas.id = `canvas-${size}`;
                
                const ctx = canvas.getContext('2d');
                
                // Create the x-g icon similar to your attachment
                // Dark background
                ctx.fillStyle = '#1a1a1a';
                ctx.fillRect(0, 0, size, size);
                
                // White pixelated x-g text
                ctx.fillStyle = '#ffffff';
                ctx.font = `bold ${Math.floor(size * 0.4)}px monospace`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                // Add some pixelated effect by using a smaller font and scaling
                ctx.imageSmoothingEnabled = false;
                ctx.fillText('x-g', size / 2, size / 2);
                
                const label = document.createElement('div');
                label.textContent = `${size}x${size}`;
                
                const downloadBtn = document.createElement('button');
                downloadBtn.textContent = 'Download';
                downloadBtn.onclick = () => downloadIcon(canvas, size);
                
                preview.appendChild(canvas);
                preview.appendChild(label);
                preview.appendChild(downloadBtn);
                container.appendChild(preview);
            });
        }
        
        function downloadIcon(canvas, size) {
            const link = document.createElement('a');
            link.download = `x-g-icon-${size}x${size}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
        
        function downloadAll() {
            sizes.forEach((size, index) => {
                const canvas = document.getElementById(`canvas-${size}`);
                if (canvas) {
                    setTimeout(() => downloadIcon(canvas, size), index * 200);
                }
            });
        }
        
        // Auto-generate on load
        window.onload = generateIcons;
    </script>
</body>
</html>
