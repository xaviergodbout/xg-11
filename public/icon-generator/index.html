<!DOCTYPE html>
<html>
<head>
    <title>PWA Icon Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #1a1a1a;
            color: white;
        }
        canvas {
            border: 1px solid #333;
            margin: 10px;
            background: white;
        }
        .icon-preview {
            display: inline-block;
            margin: 10px;
            text-align: center;
        }
        button {
            background: #00ff88;
            color: #1a1a1a;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>PWA Icon Generator for x-g.ca</h1>
    <p>This tool helps generate PNG icons from your SVG favicon for PWA compatibility.</p>
    
    <div id="icons-container"></div>
    
    <button onclick="generateIcons()">Generate Icons</button>
    <button onclick="downloadAll()">Download All</button>

    <script>
        const iconSizes = [72, 96, 128, 144, 152, 192, 384, 512];
        const svgContent = `
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
                <rect width="100" height="100" fill="#1a1a1a"/>
                <text x="50" y="60" fill="#00ff88" text-anchor="middle" font-family="monospace" font-size="40" font-weight="bold">x-g</text>
            </svg>
        `;

        function generateIcons() {
            const container = document.getElementById('icons-container');
            container.innerHTML = '';

            iconSizes.forEach(size => {
                const iconDiv = document.createElement('div');
                iconDiv.className = 'icon-preview';
                
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                canvas.id = `icon-${size}`;
                
                const ctx = canvas.getContext('2d');
                
                // Create a simple icon
                ctx.fillStyle = '#1a1a1a';
                ctx.fillRect(0, 0, size, size);
                
                // Add the x-g text
                ctx.fillStyle = '#00ff88';
                ctx.font = `bold ${size * 0.4}px monospace`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('x-g', size / 2, size / 2);
                
                const label = document.createElement('div');
                label.textContent = `${size}x${size}`;
                
                const downloadBtn = document.createElement('button');
                downloadBtn.textContent = 'Download';
                downloadBtn.onclick = () => downloadIcon(canvas, size);
                
                iconDiv.appendChild(canvas);
                iconDiv.appendChild(label);
                iconDiv.appendChild(downloadBtn);
                container.appendChild(iconDiv);
            });
        }

        function downloadIcon(canvas, size) {
            const link = document.createElement('a');
            link.download = `icon-${size}x${size}.png`;
            link.href = canvas.toDataURL();
            link.click();
        }

        function downloadAll() {
            iconSizes.forEach(size => {
                const canvas = document.getElementById(`icon-${size}`);
                if (canvas) {
                    setTimeout(() => downloadIcon(canvas, size), size); // Stagger downloads
                }
            });
        }

        // Generate icons on load
        window.onload = generateIcons;
    </script>
</body>
</html>
