media:
  - name: link-icons
    label: Link icons
    input: src/img/xg_icon
    output: img/xg_icon
    extensions: [svg, webp, png, jpg, jpeg]
    rename: safe

content:
  - name: link_sections
    label: Link sections
    type: file
    path: src/_data/linkSections.json
    format: json
    list: true
    fields:
      - name: title
        label: Section title
        type: string
        required: true

      - name: class
        label: CSS class
        type: string
        required: true

      - name: links
        label: Links
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.label}"
        fields:
          - name: active
            label: Active
            type: boolean
            default: true
            description: When disabled, this item is not rendered on the website.

          - name: url
            label: URL
            type: string
            required: true

          - name: icon
            label: Icon
            type: image
            required: true
            options:
              media: link-icons
              extensions: [svg, webp, png, jpg, jpeg]
              rename: safe

          - name: alt
            label: Icon alt text
            type: string
            required: false

          - name: label
            label: Link label
            type: string
            required: true

          - name: description
            label: Description
            type: string
            required: true

          - name: external
            label: External link
            type: boolean
            required: true
